# Mosaic Weather System
#   About 5:30 AM Eastern: daily report (every day)
#   Noon Eastern: update, only sent when something is flagged
#   "Run workflow" button: on-demand update
name: Weather run

on:
  schedule:
    - cron: "30 9 * * *"    # 5:30 AM Eastern, daylight saving time
    - cron: "30 10 * * *"   # 5:30 AM Eastern, standard time
    - cron: "0 16 * * *"    # noon Eastern, daylight saving time
    - cron: "0 17 * * *"    # noon Eastern, standard time
  workflow_dispatch:

# One run at a time, so a late run can never overlap another
concurrency:
  group: weather-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Work out which run this is
        id: clock
        run: |
          # Only the trigger that matches the current clock setting counts,
          # so a run GitHub starts late can't turn into a second email.
          OFFSET=$(TZ=America/New_York date +%z)
          if [ "$OFFSET" = "-0400" ]; then MORNING="30 9 * * *"; NOON="0 16 * * *";
          else MORNING="30 10 * * *"; NOON="0 17 * * *"; fi
          if [ "${{ github.event_name }}" != "schedule" ]; then MODE=manual
          elif [ "${{ github.event.schedule }}" = "$MORNING" ]; then MODE=morning
          elif [ "${{ github.event.schedule }}" = "$NOON" ]; then MODE=noon
          else MODE=skip; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Eastern offset $OFFSET, trigger '${{ github.event.schedule }}', run mode: $MODE"

      - name: Get the code
        if: steps.clock.outputs.mode != 'skip'
        uses: actions/checkout@v6

      - name: Load the last report (for "what changed")
        if: steps.clock.outputs.mode != 'skip'
        uses: actions/cache/restore@v5
        with:
          path: state
          key: mws-state-${{ github.run_id }}
          restore-keys: mws-state-

      - name: Set up Python
        if: steps.clock.outputs.mode != 'skip'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install libraries
        if: steps.clock.outputs.mode != 'skip'
        run: pip install -r requirements.txt

      - name: Pull the forecast
        if: steps.clock.outputs.mode != 'skip'
        run: python src/fetch_forecast.py

      - name: Apply the rules
        if: steps.clock.outputs.mode != 'skip'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python src/evaluate.py

      - name: Build the email
        if: steps.clock.outputs.mode != 'skip'
        env:
          RUN_MODE: ${{ steps.clock.outputs.mode }}
        run: python src/build_email.py

      - name: Build the weather map
        if: steps.clock.outputs.mode != 'skip'
        run: python src/build_map.py

      - name: Send the email through Power Automate
        if: steps.clock.outputs.mode != 'skip'
        env:
          RUN_MODE: ${{ steps.clock.outputs.mode }}
          MWS_FLOW_URL: ${{ secrets.MWS_FLOW_URL }}
          MWS_FLOW_KEY: ${{ secrets.MWS_FLOW_KEY }}
        run: python src/send_email.py

      - name: Save this report for next time
        if: always() && steps.clock.outputs.mode != 'skip'
        uses: actions/cache/save@v5
        with:
          path: state
          key: mws-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Email an alert if anything failed
        if: failure() && steps.clock.outputs.mode != 'skip'
        env:
          RUN_MODE: ${{ steps.clock.outputs.mode }}
          MWS_FLOW_URL: ${{ secrets.MWS_FLOW_URL }}
          MWS_FLOW_KEY: ${{ secrets.MWS_FLOW_KEY }}
        run: python src/notify_failure.py

      - name: Save results for download
        if: always() && steps.clock.outputs.mode != 'skip'
        uses: actions/upload-artifact@v6
        with:
          name: weather-run
          path: output/
          if-no-files-found: warn
