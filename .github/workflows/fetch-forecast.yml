# Test run: pulls the forecast, applies the rules, and saves both files
# for download. Start it by hand from the Actions tab (no schedule yet).
name: Weather run (test)

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Pull the forecast
        run: python src/fetch_forecast.py

      - name: Apply the rules
        run: python src/evaluate.py

      - name: Build the email
        run: python src/build_email.py

      - name: Send the email through Power Automate
        env:
          MWS_FLOW_URL: ${{ secrets.MWS_FLOW_URL }}
          MWS_FLOW_KEY: ${{ secrets.MWS_FLOW_KEY }}
        run: python src/send_email.py

      - name: Save results for download
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: weather-run
          path: output/
          if-no-files-found: warn
