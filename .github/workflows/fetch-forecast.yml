# Mosaic Weather System, every day including weekends
#   5:30 AM Eastern: full daily briefing (always sent)
#   9 AM, noon, 3 PM, 6 PM, 9 PM: checks that email only if a flag changed
#     since the last email (new, worse, eased, dropped, amounts, rush-hour
#     timing, official alerts)
#   "Run workflow" button: preview only by default (builds everything, sends
#   nothing); "Send to me only" for a test email; "Send to everyone" to send an
#   on-demand update
#
# GitHub schedules run on UTC, which ignores daylight saving, so each time
# has two triggers. Only the one matching the current Eastern clock counts.
name: Weather run

on:
  schedule:
    - cron: "30 9 * * *"    # 5:30 AM briefing, daylight saving time
    - cron: "30 10 * * *"   # 5:30 AM briefing, standard time
    - cron: "0 13 * * *"    # 9 AM check, daylight saving time
    - cron: "0 14 * * *"    # 9 AM check, standard time
    - cron: "0 16 * * *"    # noon check, daylight saving time
    - cron: "0 17 * * *"    # noon check, standard time
    - cron: "0 19 * * *"    # 3 PM check, daylight saving time
    - cron: "0 20 * * *"    # 3 PM check, standard time
    - cron: "0 22 * * *"    # 6 PM check, daylight saving time
    - cron: "0 23 * * *"    # 6 PM check, standard time
    - cron: "0 1 * * *"     # 9 PM check, daylight saving time
    - cron: "0 2 * * *"     # 9 PM check, standard time
  workflow_dispatch:
    inputs:
      delivery:
        description: "What to do with the report"
        type: choice
        options:
          - "Preview only, no email"
          - "Send to me only"
          - "Send to everyone"
        default: "Preview only, no email"

# One run at a time, so a late run can never overlap another
concurrency:
  group: weather-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Work out which run this is
        id: clock
        run: |
          # Only the trigger that matches the current clock setting counts,
          # so a run GitHub starts late can't turn into a second email.
          OFFSET=$(TZ=America/New_York date +%z)
          case "$OFFSET|${{ github.event.schedule }}" in
            "-0400|30 9 * * *"|"-0500|30 10 * * *") MODE=morning; SLOT="6 AM" ;;
            "-0400|0 13 * * *"|"-0500|0 14 * * *")  MODE=check; SLOT="9 AM" ;;
            "-0400|0 16 * * *"|"-0500|0 17 * * *")  MODE=check; SLOT="noon" ;;
            "-0400|0 19 * * *"|"-0500|0 20 * * *")  MODE=check; SLOT="3 PM" ;;
            "-0400|0 22 * * *"|"-0500|0 23 * * *")  MODE=check; SLOT="6 PM" ;;
            "-0400|0 1 * * *"|"-0500|0 2 * * *")    MODE=check; SLOT="9 PM" ;;
            *) MODE=skip; SLOT="" ;;
          esac
          if [ "${{ github.event_name }}" != "schedule" ]; then MODE=manual; SLOT=""; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "Eastern offset $OFFSET, trigger '${{ github.event.schedule }}', run mode: $MODE $SLOT"

      - name: Get the code
        if: steps.clock.outputs.mode != 'skip'
        uses: actions/checkout@v6

      - name: Load the last report (for "what changed")
        if: steps.clock.outputs.mode != 'skip'
        uses: actions/cache/restore@v5
        with:
          path: state
          key: mws-state-${{ github.run_id }}
          restore-keys: mws-state-

      - name: Set up Python
        if: steps.clock.outputs.mode != 'skip'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install libraries
        if: steps.clock.outputs.mode != 'skip'
        run: pip install -r requirements.txt

      - name: Pull the forecast
        if: steps.clock.outputs.mode != 'skip'
        run: python src/fetch_forecast.py

      - name: Apply the rules
        if: steps.clock.outputs.mode != 'skip'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python src/evaluate.py

      - name: Build the email
        if: steps.clock.outputs.mode != 'skip'
        env:
          RUN_MODE: ${{ steps.clock.outputs.mode }}
          RUN_SLOT: ${{ steps.clock.outputs.slot }}
        run: python src/build_email.py

      - name: Build the weather map
        if: steps.clock.outputs.mode != 'skip'
        run: python src/build_map.py

      - name: Show the preview on this page
        if: steps.clock.outputs.mode != 'skip'
        run: |
          python - <<'EOF'
          import json, os
          email = json.load(open("output/email.json", encoding="utf-8"))
          res = json.load(open("output/results.json", encoding="utf-8"))
          sending = os.environ["GITHUB_EVENT_NAME"] == "schedule" or os.environ.get("DELIVERY") in ("Send to everyone", "Send to me only")
          changes = res.get("changes", [])
          lines = [
              "## Mosaic Weather System",
              "**Email:** " + ("sent to you only (test)" if os.environ.get("DELIVERY") == "Send to me only"
                               else "being sent if warranted" if sending else "preview only, nothing sent"),
              "",
              "**Subject:** " + email["subject"],
              "",
              "**Bottom line:** " + res.get("bottom_line", ""),
              "",
              f"**Changes since the last email:** {len(changes)}"
              + (" (a check at this time would send an update)" if changes else " (a check at this time would stay quiet)"),
          ] + [f"- {c['phrase']} ({c['when']})" for c in changes] + [
              "",
              "To see the full email and map, download **weather-run** at the bottom of this page "
              "and open email.html and weather-map.html.",
          ]
          open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8").write("\n".join(lines) + "\n")
          EOF
        env:
          DELIVERY: ${{ inputs.delivery }}

      - name: Send the email through Power Automate
        if: steps.clock.outputs.mode != 'skip' && (github.event_name == 'schedule' || inputs.delivery == 'Send to everyone' || inputs.delivery == 'Send to me only')
        env:
          DELIVERY: ${{ inputs.delivery }}
          RUN_MODE: ${{ steps.clock.outputs.mode }}
          RUN_SLOT: ${{ steps.clock.outputs.slot }}
          MWS_FLOW_URL: ${{ secrets.MWS_FLOW_URL }}
          MWS_FLOW_KEY: ${{ secrets.MWS_FLOW_KEY }}
        run: python src/send_email.py

      - name: Save this report for next time
        if: always() && steps.clock.outputs.mode != 'skip'
        uses: actions/cache/save@v5
        with:
          path: state
          key: mws-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Email an alert if anything failed
        if: failure() && github.event_name == 'schedule' && steps.clock.outputs.mode != 'skip'
        env:
          RUN_MODE: ${{ steps.clock.outputs.mode }}
          MWS_FLOW_URL: ${{ secrets.MWS_FLOW_URL }}
          MWS_FLOW_KEY: ${{ secrets.MWS_FLOW_KEY }}
        run: python src/notify_failure.py

      - name: Save results for download
        if: always() && steps.clock.outputs.mode != 'skip'
        uses: actions/upload-artifact@v6
        with:
          name: weather-run
          path: output/
          if-no-files-found: warn
