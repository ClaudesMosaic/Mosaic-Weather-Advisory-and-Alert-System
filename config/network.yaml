# Mosaic Weather Advisory and Alert System: network configuration
# Every setting the system uses lives here. Edit this file to change
# locations, routes, schedules or rules; no code changes needed.
#
# Coordinates marked "verify" are approximate. To get exact ones, right-click
# the building in Google Maps and click the numbers at the top of the menu
