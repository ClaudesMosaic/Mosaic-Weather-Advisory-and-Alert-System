# ------------------------------------------------------------------
# Truck runs
# drive_min values are estimated normal drive times, to be tuned once we
# compare against real trips. Stop time is 30 to 60 minutes; the system plans
# on the middle and widens each check window to cover the full range.
# ------------------------------------------------------------------
stop_minutes: {min: 30, max: 60}

runs:
  northern_loop:
    name: Northern loop
    operator: Mosaic truck
    days: [Mon, Tue, Wed, Thu, Fri]
    depart: "17:30"
    legs:
      - {from: csc,        to: alexandria, drive_min: 90, via: [fred, wood, spring]}
      - {from: alexandria, to: nbethesda,  drive_min: 45, via: [tysons]}
      - {from: nbethesda,  to: chantilly,  drive_min: 45, via: [tysons, i66]}
      - {from: chantilly,  to: fairfax,    drive_min: 30, via: [i66]}
      - {from: fairfax,    to: csc,        drive_min: 90, via: [spring, wood, fred]}

  southern_loop:
    name: Southern loop
    operator: Mosaic truck
    days: [Mon, Tue, Wed, Thu, Fri]
    depart: "16:30"
    legs:
      - {from: csc,     to: vabeach, drive_min: 135, via: [wburg, hrbt]}
      - {from: vabeach, to: raleigh, drive_min: 180, via: [suffolk, emporia, rockymt]}
      - {from: raleigh, to: csc,     drive_min: 180, via: [hend, shill, ptrsbg]}

  baltimore:
    name: Baltimore
    operator: Mosaic box truck
    days: [Mon, Tue, Wed, Thu, Fri]
    depart: "05:00"
    legs:
      - {from: nbethesda, to: owings, drive_min: 60, via: [cpark, b695]}

  greensboro:
    name: Greensboro
    operator: Third-party carrier
    days: [Mon, Tue, Wed, Thu, Fri]
    depart: "07:15"
    legs:
      - {from: raleigh, to: greensboro, drive_min: 90, via: [durham, burl]}

  richmond_morning:
    name: Richmond (morning)
    operator: Mosaic box truck
    days: [Tue, Wed, Thu, Fri]
    depart: "04:00"
    legs:
      - {from: csc, to: richmond, drive_min: 45, via: [rva95]}

  richmond_friday:
    name: Richmond (Friday)
    operator: Mosaic box truck
    days: [Fri]
    depart: "15:00"
    depart_flex_min: 60          # leaves between 3 and 4 PM
    legs:
      - {from: csc, to: richmond, drive_min: 45, via: [rva95]}

# ------------------------------------------------------------------
# Time windows for employee travel and store openings (local time)
# ------------------------------------------------------------------
windows:
  am_rush: {start: "05:00", end: "09:00"}
  pm_rush: {start: "15:00", end: "19:00"}

# ------------------------------------------------------------------
# Flag rules (reporting only, not go or no-go calls)
# ------------------------------------------------------------------
rules:
  ice:
    description: Any freezing rain, freezing drizzle or sleet
    applies: always
  official_alert:
    description: NWS winter alert covering the location or checkpoint
    events:
      - Ice Storm Warning
      - Winter Storm Warning
      - Winter Storm Watch
      - Winter Weather Advisory
  rush_hour_snow:
    description: Snow during the AM or PM rush
    min_inches: 0.5
    windows: [am_rush, pm_rush]
  truck_snow:
    description: Snow while a truck is expected on a stretch
    min_inches: 1.0
  heavy_snow:
    description: Heavy snow at any time
    min_inches_12h: 3.0
    min_inches_1h: 1.0

# Below-threshold conditions worth mentioning, shown as "Heads-up"
heads_up:
  enabled: true
  near_threshold_fraction: 0.75   # e.g. 0.4" of rush-hour snow vs the 0.5" flag

# ------------------------------------------------------------------
# Data sources
# ------------------------------------------------------------------
sources:
  primary: nws          # National Weather Service, api.weather.gov
  backup: open_meteo    # used automatically if NWS is unavailable
  nws_user_agent: "Mosaic Weather System (ageldart1@mosaictileco.com)"   # NWS asks for contact info; put your work email here

# ------------------------------------------------------------------
# Links on the weather page
# ------------------------------------------------------------------
links:
  sigalert: "https://www.sigalert.com/?lat={lat}&lon={lon}&z={zoom}"
  sigalert_store_zoom: 4
  sigalert_va_default: {lat: 37.75, lon: -77.45, zoom: 2}
  cameras:
    VA: https://511.vdot.virginia.gov
    MD: https://chart.maryland.gov
    NC: https://drivenc.gov
